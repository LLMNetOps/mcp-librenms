[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-librenms"
version = "0.1.0"
description = "MCP server that exposes the LibreNMS REST API as MCP tools"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "librenms", "monitoring", "snmp", "network"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mcp-librenms = "mcp_librenms.server:run"

[tool.setuptools]
packages = ["mcp_librenms"]